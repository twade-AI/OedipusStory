<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Oedipus Detective — Year 7 Latin Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-bar" role="banner">
    <a class="site-brand" href="./" aria-label="Oedipus Detective — home">
      <img src="images/logo.png" alt="" class="site-brand-logo" />
      <span class="site-brand-text">Oedipus<span class="site-brand-amp">·</span>Detective</span>
    </a>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab active" data-view="story" role="tab" aria-selected="true">Fabula</button>
      <button class="tab" data-view="cards" role="tab" aria-selected="false">Personae</button>
      <button class="tab" data-view="clues" role="tab" aria-selected="false">Indicia</button>
      <button class="tab" data-view="vocab" role="tab" aria-selected="false">Verba</button>
    </nav>

    <div class="site-bar-controls">
      <label class="mode-control" title="Adjust English support">
        <span class="mode-label">Modus</span>
        <select id="mode-select" class="mode-select" aria-label="Difficulty mode — controls English support">
          <option value="tiro">Tiro · all English visible</option>
          <option value="discipulus" selected>Discipulus · reveal on tap</option>
          <option value="magister">Magister · Latin only</option>
        </select>
      </label>
      <button class="tab reset" id="reset-btn" title="Reset the story">Iterum</button>
    </div>

    <div class="meander-rule" aria-hidden="true"></div>
  </header>

  <main id="app" class="container" aria-live="polite"></main>

  <footer class="site-footer">
    <p>Click any Latin word to reveal its meaning. Tap the <strong>EN</strong> pill to reveal a full-line translation, or the <strong>audi</strong> pill to hear the Latin read aloud.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
